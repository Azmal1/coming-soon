
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | Your Company</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: #07090f;
            color: #fff;
            overflow: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(69, 108, 255, 0.20),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(130, 70, 255, 0.18),
                    transparent 32%
                ),
                #07090f;
            z-index: -5;
        }

        /* Animated glow */

        .glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(70, 100, 255, 0.12);
            filter: blur(100px);
            animation: moveGlow 12s ease-in-out infinite alternate;
        }

        .glow.one {
            top: -180px;
            left: -150px;
        }

        .glow.two {
            right: -180px;
            bottom: -180px;
            background: rgba(150, 70, 255, 0.10);
            animation-delay: 3s;
        }

        @keyframes moveGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(70px, 40px) scale(1.1);
            }

            100% {
                transform: translate(-30px, 80px) scale(.95);
            }
        }

        /* Grid */

        .grid {
            position: fixed;
            inset: 0;
            opacity: .08;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.3) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.3) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 10%,
                    transparent 75%
                );
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            padding: 30px 5vw;

            display: flex;
            align-items: center;
            justify-content: space-between;

            animation: fadeDown 1s ease forwards;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* LOGO */

        .logo {
            width: 48px;
            height: 48px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,.07);

            border: 1px solid rgba(255,255,255,.12);

            backdrop-filter: blur(15px);

            overflow: hidden;

            box-shadow:
                0 10px 40px rgba(0,0,0,.3);
        }

        .logo img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #a1a1aa;

            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #7c8cff;

            box-shadow:
                0 0 15px #7c8cff;

            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .4;
                transform: scale(.7);
            }
        }

        /* =========================
           MAIN
        ========================= */

        main {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 120px 25px 80px;

            text-align: center;
        }

        .content {
            max-width: 950px;
        }

        /* Small heading */

        .eyebrow {
            display: inline-flex;

            padding: 8px 15px;

            border-radius: 50px;

            background: rgba(255,255,255,.055);

            border: 1px solid rgba(255,255,255,.1);

            color: #a5b4fc;

            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 28px;

            backdrop-filter: blur(15px);

            animation: fadeUp .8s ease forwards;
        }

        /* Main heading */

        h1 {
            font-size: clamp(55px, 9vw, 125px);

            line-height: .92;

            letter-spacing: -6px;

            font-weight: 900;

            margin-bottom: 30px;

            animation: fadeUp 1s .1s ease both;
        }

        h1 .white {
            color: #fff;
        }

        h1 .gradient {
            background:
                linear-gradient(
                    100deg,
                    #ffffff 0%,
                    #b7c2ff 35%,
                    #8b7cff 65%,
                    #ffffff 100%
                );

            background-size: 250% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: gradientMove 6s linear infinite;
        }

        @keyframes gradientMove {
            to {
                background-position: 250% center;
            }
        }

        .description {
            max-width: 650px;

            margin: auto;

            color: #9296a3;

            font-size: 17px;

            line-height: 1.8;

            animation: fadeUp 1s .25s ease both;
        }

        /* Decorative line */

        .line {
            width: 70px;
            height: 2px;

            margin: 35px auto 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #8794ff,
                    transparent
                );

            animation: expand 1.2s 1s ease both;
        }

        @keyframes expand {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 70px;
                opacity: 1;
            }
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: absolute;

            bottom: 25px;
            left: 0;

            width: 100%;

            text-align: center;

            color: #525661;

            font-size: 12px;

            letter-spacing: .5px;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 22px 20px;
            }

            .logo {
                width: 42px;
                height: 42px;
                border-radius: 12px;
            }

            .brand-name {
                font-size: 16px;
            }

            .status {
                display: none;
            }

            main {
                padding: 100px 20px 70px;
            }

            h1 {
                font-size: clamp(55px, 17vw, 80px);
                letter-spacing: -4px;
            }

            .description {
                font-size: 15px;
                line-height: 1.7;
            }

            .eyebrow {
                font-size: 10px;
                letter-spacing: 1.5px;
            }

            footer {
                bottom: 18px;
            }
        }

    </style>
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="glow one"></div>
        <div class="glow two"></div>
    </div>

    <div class="grid"></div>


    <!-- HEADER -->

    <header>

        

        <div class="status">
            <span class="status-dot"></span>
            Website Under Development
        </div>

    </header>


    <!-- MAIN -->

    <main>

        <div class="content">

            <div class="eyebrow">
                ✦ Something New Is Coming
            </div>

            <h1>
                <span class="white">We Are</span><br>
                <span class="gradient">Coming Soon.</span>
            </h1>

            <p class="description">
                We're building something special.
                Our new digital experience is currently
                under development and will be launching soon.
            </p>

            <div class="line"></div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        © 2026 YOUR COMPANY · All Rights Reserved
    </footer>


</body>
</html>
