<head>

<title>Sawdax | Coming Soon</title>

<style>
:root{--navy:#0c1f6b;--deep:#050c33;--green:#12c25a;--gray:#d9dbde;--x:50%;--y:40%;--tx:0;--ty:0;--pad:clamp(22px,6vw,96px)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--deep);color:#fff;overflow-x:hidden}

/* cursor spotlight: glow + grid that only appears near the pointer */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.fx::before{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at var(--x) var(--y),rgba(18,194,90,.22),transparent 65%),radial-gradient(900px circle at 85% 110%,rgba(36,71,214,.35),transparent 60%)}
.fx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(340px circle at var(--x) var(--y),#000,transparent 70%);mask-image:radial-gradient(340px circle at var(--x) var(--y),#000,transparent 70%)}

/* one-time intro wipe (removed automatically afterwards) */
.wipe{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;animation:gone 0s 1.8s forwards}
.wipe i{position:absolute;top:-10%;height:120%;width:70%;left:-90%;transform:skewX(-35deg);animation:wipe 1.2s cubic-bezier(.7,0,.2,1) forwards}
.wipe i:nth-child(1){background:var(--green)}
.wipe i:nth-child(2){background:#fff;animation-delay:.1s}
.wipe i:nth-child(3){background:var(--navy);animation-delay:.2s}
@keyframes wipe{to{left:130%}}
@keyframes gone{to{visibility:hidden}}

/* FIX: page now fits the screen height and scrolls if the window is very short */
.stage{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto auto;padding:clamp(20px,3vw,36px) var(--pad) 20px}
nav{display:flex;justify-content:space-between;align-items:center}
.plate{background:#fff;padding:10px 34px;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);animation:fadeIn .8s .9s backwards}
.plate img{display:block;height:clamp(34px,4.4vw,48px);width:auto}
.live{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;animation:fadeIn .8s 1s backwards}
.live b{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,194,90,.7)}70%,100%{box-shadow:0 0 0 12px rgba(18,194,90,0)}}
@keyframes fadeIn{from{opacity:0}}

.hero{align-self:center;padding:20px 0}
/* FIX: headline size now follows screen height too, so nothing is pushed off-screen */
h1{font-size:clamp(56px,min(15vw,24vh),240px);line-height:.86;font-weight:800;letter-spacing:-.05em;transform:perspective(900px) rotateY(calc(var(--tx)*7deg)) rotateX(calc(var(--ty)*-5deg));transition:transform .25s ease-out}
.line{display:block;overflow:hidden;padding:.04em .08em .1em 0;margin:-.04em 0 -.1em}
.line.out .ch{color:transparent;-webkit-text-stroke:2px #fff}
/* FIX: letters are visible by default; the animation only plays the slide-in (and no longer blocks hover) */
.ch{display:inline-block;animation:letter .9s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(.9s + var(--i)*.07s);transition:transform .3s,color .3s,-webkit-text-stroke-color .3s}
@keyframes letter{from{transform:translateY(110%) skewY(8deg);opacity:0}}
.line .ch:hover{transform:translateY(-6%) skewX(-10deg);color:var(--green);-webkit-text-stroke-color:var(--green)}
.hero p{font-size:clamp(17px,1.8vw,22px);line-height:1.6;color:rgba(255,255,255,.75);max-width:40ch;margin-top:clamp(16px,2.6vw,30px);animation:fadeIn 1s 2s backwards}

/* slanted sliding text strip */
.belt{margin:0 calc(-1*var(--pad));overflow:hidden;background:var(--green);color:var(--navy);transform:skewY(-2deg);padding:14px 0;animation:fadeIn .8s 1.6s backwards}
.belt div{display:flex;width:max-content;animation:belt 22s linear infinite}
.belt span{display:inline-flex;align-items:center;font-size:clamp(24px,3.2vw,40px);font-weight:800;letter-spacing:-.01em;padding-right:40px;white-space:nowrap}
.belt span::after{content:"";width:14px;height:14px;background:var(--navy);margin-left:40px;transform:skewX(-35deg)}
@keyframes belt{to{transform:translateX(-50%)}}
footer{font-size:14px;color:rgba(255,255,255,.6);padding-top:18px;text-align:center}

@media(max-width:700px){nav{flex-direction:column;align-items:flex-start;gap:16px}.live{font-size:14px}.plate{padding:9px 26px}.line.out .ch{-webkit-text-stroke-width:1.5px}}
@media(prefers-reduced-motion:reduce){.wipe{display:none}.ch,.plate,.live,.hero p,.belt{animation:none}.belt div{animation:none}}
</style>
</head>

  <section class="hero">
    <h1 aria-label="Coming soon">
      <span class="line" data-t="Coming" aria-hidden="true"></span>
      <span class="line out" data-t="soon." aria-hidden="true"></span>
    </h1>
    <p>We're building a smarter, faster way to rent. Something great is on its way.</p>
  </section>

  <div class="belt" aria-hidden="true"><div id="belt"></div></div>

  <footer>&copy; <span id="yr"></span> Sawdax. All rights reserved.</footer>
</div>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

// split headline into letters for the staggered slide-in
let n = 0;
document.querySelectorAll('.line').forEach(l => {
  [...l.dataset.t].forEach(c => {
    const s = document.createElement('span');
    s.className = 'ch'; s.style.setProperty('--i', n++); s.textContent = c;
    l.appendChild(s);
  });
});

// sliding strip: phrases repeated twice so the loop is seamless
const items = ['Coming soon','New website','Smarter rentals','Sawdax','Coming soon','New website','Smarter rentals','Sawdax'];
const html = items.map(t => `<span>${t}</span>`).join('');
document.getElementById('belt').innerHTML = html + html;

// spotlight + tilt follow the pointer
const root = document.documentElement;
addEventListener('pointermove', e => {
  root.style.setProperty('--x', e.clientX + 'px');
  root.style.setProperty('--y', e.clientY + 'px');
  root.style.setProperty('--tx', (e.clientX / innerWidth - .5).toFixed(3));
  root.style.setProperty('--ty', (e.clientY / innerHeight - .5).toFixed(3));
});
</script>
